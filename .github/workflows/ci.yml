name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/backend/Cipso.Registry.Api/Cipso.Registry.Api.csproj
      - name: Build
        run: dotnet build src/backend/Cipso.Registry.Api/Cipso.Registry.Api.csproj --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: src/frontend
        run: npm install
      - name: Build
        working-directory: src/frontend
        run: npm run build
