services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cipso_registry}
      POSTGRES_USER: ${POSTGRES_USER:-cipso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cipso_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cipso} -d ${POSTGRES_DB:-cipso_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend/Cipso.Registry.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-cipso_registry};Username=${POSTGRES_USER:-cipso};Password=${POSTGRES_PASSWORD:-cipso_dev_password}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
