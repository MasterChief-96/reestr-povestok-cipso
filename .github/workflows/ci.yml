name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Cipso.Registry.Api.Tests/Cipso.Registry.Api.Tests.csproj
      - name: Test
        run: dotnet test tests/Cipso.Registry.Api.Tests/Cipso.Registry.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: src/frontend
        run: npm install
      - name: Build
        working-directory: src/frontend
        run: npm run build
